name: Bot AINVENTARIO

on:
  workflow_dispatch:

concurrency:
  group: ainventario-sharepoint
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ainventario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r bot/requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar Bot AINVENTARIO
        env:
          POSCO_USER: ${{ secrets.POSCO_USER }}
          POSCO_PASSWORD: ${{ secrets.POSCO_PASSWORD }}
          SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
        run: python -u bot/data_ainventario.py

      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-posco
          path: artifacts/inventario/capturas/*.png
          retention-days: 7

      - name: Guardar reporte descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-ainventario-${{ github.run_number }}
          path: artifacts/inventario/reportes/*.xlsx
          if-no-files-found: warn
          retention-days: 7
